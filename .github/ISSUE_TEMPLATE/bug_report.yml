name: Bug report
description: Report something that is broken or incorrect
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Before you post this issue, please check the [documentation](../../docs) for any relevant information.

  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: command_used
    attributes:
      label: Command used and terminal output
      description: Steps to reproduce the behaviour. Please paste the command you used to launch the pipeline and the output from your terminal.
      render: console
      placeholder: |
        $ nextflow run TRON-Bioinformatics/qcpanda ...

        Some output where something broke

  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: |
        Please drag and drop the relevant files here. Create a `.zip` archive if the extension is not allowed.
        Your verbose log file `.nextflow.log` is often useful _(this is a hidden file in the directory where you launched the pipeline)_ as well as custom Nextflow configuration files.

  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        * Nextflow version _(e.g. 23.04.0)_
        * Hardware _(e.g. HPC, Desktop, Cloud)_
        * Executor _(e.g. slurm, local)_
        * Container engine _(e.g. Singularity, Docker, Conda)_
        * OS _(e.g. CentOS Linux, Ubuntu, macOS)_
        * Version of TRON/qcpanda _(e.g. 1.0.0)_
