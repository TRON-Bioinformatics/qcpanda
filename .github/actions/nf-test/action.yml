name: "nf-test Action"
description: "Runs nf-test with common setup steps (Nextflow, nf-test, Apptainer/Singularity)"

inputs:
  profile:
    description: "Nextflow profile(s) to use, e.g. 'test,singularity'"
    required: true
  nxf_version:
    description: "Nextflow version to install"
    required: false
    default: "latest-stable"

runs:
  using: "composite"
  steps:
    - name: Setup Nextflow
      uses: nf-core/setup-nextflow@v2
      with:
        version: "${{ inputs.nxf_version }}"

    - name: Install nf-test
      uses: nf-core/setup-nf-test@v1
      with:
        version: "${{ env.NFT_VER }}"
        install-pdiff: true

    - name: Setup Apptainer
      if: contains(inputs.profile, 'singularity')
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.4

    - name: Cache Singularity images
      if: contains(inputs.profile, 'singularity')
      uses: actions/cache@v4
      with:
        path: /tmp/singularity_cache
        key: ${{ runner.os }}-singularity-${{ hashFiles('**/*.config') }}
        restore-keys: |
          ${{ runner.os }}-singularity-

    - name: Run nf-test
      shell: bash
      env:
        NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
      run: |
        nf-test test \
          --profile=${{ inputs.profile }} \
          --ci \
          --verbose \
          --tap=test.tap

    - name: Generate test summary
      if: always()
      shell: bash
      run: |
        if [ -f test.tap ]; then
          echo "# nf-test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Test Name | Profile |" >> $GITHUB_STEP_SUMMARY
          echo "|:------:|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            if [[ $line =~ ^ok ]]; then
              test_name="${line#ok }"; test_name="${test_name#* }"
              echo "| ✅ | ${test_name} | ${{ inputs.profile }} |" >> $GITHUB_STEP_SUMMARY
            elif [[ $line =~ ^not\ ok ]]; then
              test_name="${line#not ok }"; test_name="${test_name#* }"
              echo "| ❌ | ${test_name} | ${{ inputs.profile }} |" >> $GITHUB_STEP_SUMMARY
            fi
          done < test.tap
        else
          echo "| ⚠️ | No test results found | ${{ inputs.profile }} |" >> $GITHUB_STEP_SUMMARY
        fi
