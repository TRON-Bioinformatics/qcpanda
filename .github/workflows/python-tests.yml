name: Python unit tests

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pytest:
    name: Python unit tests (bin/)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest biopython==1.84

      - name: Run pytest
        run: pytest bin/tests/ -v
