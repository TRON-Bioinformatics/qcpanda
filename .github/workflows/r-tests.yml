name: R unit tests

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  r-tests:
    name: R unit tests (bin/)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::testthat
            cran::tidyverse

      - name: Check out unit test data
        uses: actions/checkout@v4
        with:
          repository: TRON-Bioinformatics/test-datasets
          ref: qcpanda
          path: _testdata
          sparse-checkout: |
            unittest_data

      - name: Copy unit test data
        run: |
          mkdir -p bin/tests/data
          cp -r _testdata/unittest_data/. bin/tests/data/

      - name: Run R unit tests
        run: Rscript bin/tests/test_custom_functions.R
