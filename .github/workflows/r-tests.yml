name: R unit tests

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  r-tests:
    name: R unit tests (bin/)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::testthat
            cran::tidyverse

      - name: Run R unit tests
        run: Rscript bin/tests/test_custom_functions.R
